<div class="app-container">
  <nav class="navbar">
    <div class="nav-left">
      <div class="logo">
        <a routerLink="/" style="color: inherit; text-decoration: none;">🎭 TheaterBooking</a>
      </div>
    </div>

    <ul class="nav-links">
      <li><a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">Accueil</a></li>
      <li><a routerLink="/show" routerLinkActive="active">Spectacles</a></li>
      <li><a routerLink="/reservations" routerLinkActive="active" *ngIf="authService.isLoggedIn$ | async">Mes Réservations</a></li>
      <li><a routerLink="/artists" routerLinkActive="active" *ngIf="authService.isAdmin()">Artistes</a></li>
      <li><a routerLink="/users" routerLinkActive="active" *ngIf="authService.isAdmin()">Utilisateurs</a></li>
    </ul>

    <div class="user-profile">
      <ng-container *ngIf="authService.isLoggedIn$ | async; else publicAuthRight">
        <a routerLink="/profile" class="user-avatar" style="text-decoration: none; cursor: pointer;">
          👤 {{ authService.currentUser$ | async }}
        </a>
        <button class="btn-logout" (click)="logout()">Déconnexion</button>
      </ng-container>

      <ng-template #publicAuthRight>
        <a routerLink="/login" class="btn-primary" style="text-decoration: none;">Connexion</a>
      </ng-template>
    </div>
  </nav>

  <main class="content">
    <router-outlet></router-outlet>
  </main>

  <footer class="footer">
    <p>&copy; 2026 TheaterBooking. Tous droits réservés.</p>
  </footer>
</div>
